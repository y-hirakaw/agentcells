name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml に書いたバージョンを入れる（ランナーに入っているRustは使わない）
      - name: Install Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Check install.sh
        run: |
          AGENTCELLS_HOME="$RUNNER_TEMP/agentcells" ./install.sh
          "$RUNNER_TEMP/agentcells/bin/agentcells" --version

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 履歴の全部を調べる
          fetch-depth: 0
      - name: Install betterleaks
        env:
          VERSION: 1.9.0
          SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
        run: |
          curl -fsSLo betterleaks.tar.gz "https://github.com/betterleaks/betterleaks/releases/download/v${VERSION}/betterleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  betterleaks.tar.gz" | sha256sum -c -
          tar xzf betterleaks.tar.gz betterleaks
          sudo mv betterleaks /usr/local/bin/
      - run: betterleaks git --no-banner --redact .
