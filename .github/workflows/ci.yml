name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml に書いたバージョンを入れる（ランナーに入っているRustは使わない）
      - name: Install Rust toolchain
        run: rustup toolchain install
      - run: rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Check install.sh
        run: |
          AGENTCELLS_HOME="$RUNNER_TEMP/agentcells" ./install.sh
          "$RUNNER_TEMP/agentcells/bin/agentcells" --version
